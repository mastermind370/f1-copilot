# Render Blueprint: New > Blueprint > pick this repo. Set COPILOT_ALLOWED_ORIGINS to your
# Vercel URL after the web app is deployed.
services:
  - type: web
    name: f1-copilot-api
    runtime: docker
    plan: standard            # 2 GB RAM. The free and starter plans (512 MB) run out of memory.
    healthCheckPath: /api/health
    envVars:
      - key: COPILOT_ALLOWED_ORIGINS
        sync: false
