id: form-8843-filing
version: 1
title: IRS Form 8843 filing deadline
category: tax
summary: >-
  Nonresident alien F-1 students file Form 8843 for each tax year they were in the US.
  With US income, it is attached to Form 1040-NR (due mid-April). With no US income,
  you file Form 8843 alone (due mid-June).
source:
  url: https://www.irs.gov/forms-pubs/about-form-8843
  verification: secondary
  last_verified: 2026-11-27
notes:
  - Applies to nonresident aliens for tax purposes. Most F-1 students are, for their first five calendar years.
  - Weekend dates are moved to Monday. Federal and DC holidays are not modeled. Confirm the IRS date each year.
  - This is not tax advice. Your school may offer free tax software for nonresidents.
when: {fact: tax_year, is_set: true}
outputs:
  - kind: deadline
    label: File Form 8843 with Form 1040-NR by
    when: {fact: had_us_income, eq: true}
    date:
      calendar: {year_fact: tax_year, year_offset: 1, month: 4, day: 15}
      roll: next_business_day
  - kind: deadline
    label: Mail Form 8843 (no US income) by
    when: {fact: had_us_income, eq: false}
    date:
      calendar: {year_fact: tax_year, year_offset: 1, month: 6, day: 15}
      roll: next_business_day
changelog:
  - "v1 (2026-11-27): initial version"
