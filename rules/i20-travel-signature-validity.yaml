id: i20-travel-signature-validity
version: 1
title: I-20 travel signature validity
category: travel
summary: >-
  To re-enter the US, the travel signature on page 2 of your I-20 must be recent:
  generally within 12 months for enrolled students, and within 6 months on OPT or STEM OPT.
  Many schools treat it as ending earlier at your program end date or EAD expiration date.
source:
  url: https://isss.utah.edu/f-1-visa/f-1-students/travel/index.php
  verification: secondary
  last_verified: 2026-11-27
notes:
  - The signature must still be valid on the day you RE-ENTER the US, not the day you leave.
  - Some schools use different conventions. Your DSO's guidance takes priority.
when: {fact: last_travel_signature_date, is_set: true}
outputs:
  - kind: deadline
    label: Travel signature valid for re-entry until (enrolled student)
    when: {fact: on_opt, eq: false}
    date:
      min:
        - {fact: last_travel_signature_date, months: 12}
        - {fact: program_end_date, optional: true}
  - kind: deadline
    label: Travel signature valid for re-entry until (on OPT)
    when: {fact: on_opt, eq: true}
    date:
      min:
        - {fact: last_travel_signature_date, months: 6}
        - {fact: opt_ead_end_date, optional: true}
changelog:
  - "v1 (2026-11-27): initial version"
